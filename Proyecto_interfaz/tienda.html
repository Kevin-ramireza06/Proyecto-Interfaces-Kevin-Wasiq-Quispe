<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Estilos/estilosGenerales.css" />
    <link rel="stylesheet" href="Estilos/estilosTienda.css">
    <title>Suscripciones y Merchandising</title>
  </head>
  <body>
    <header>
      <div id="contenedorLogo">
        <img
          src="imagenes/Logo y inicio/logo.jpg"
          alt="imagen Logo"
          id="logo"
        />
      </div>
      <nav>
        <a href="index.html" class="nav-item">
          <img
            src="imagenes/Logo y inicio/logos/icons8-casa-64.png"
            alt="Inicio"
            class="logotipo"
          />
          <span>Inicio</span>
        </a>
        <a href="tienda.html" class="nav-item activado">
          <img
            src="imagenes/Logo y inicio/logos/icons8-carrito-de-compras-48.png"
            alt="Tienda"
            class="logotipo"
          />
          <span>Tienda Oficial TF</span>
        </a>
        <a href="historia.html" class="nav-item">
          <img
            src="imagenes/Logo y inicio/logos/icons8-estrella-64.png"
            alt="Historia"
            class="logotipo"
          />
          <span>Historia</span>
        </a>
      </nav>
      <div id="redesSociales">
        <a href="https://www.instagram.com" target="_blank">
          <img
            src="imagenes/Logo y inicio/logos/icons8-instagram-24.png"
            alt="Instagram"
            class="logotipo"
          />
        </a>
        <a href="https://www.tiktok.com" target="_blank">
          <img
            src="imagenes/Logo y inicio/logos/icons8-tik-tok-50.png"
            alt="TikTok"
            class="logotipo"
          />
        </a>
        <a href="https://www.facebook.com" target="_blank">
          <img
            src="imagenes/Logo y inicio/logos/icons8-facebook-nuevo-50.png"
            alt="Facebook"
            class="logotipo"
          />
        </a>
      </div>
    </header>
    <main>
      <div class="bonos">
        <h1>Bonos</h1>
        <div class="membresias">
          <img src="imagenes/Tarjetas de bono/TARJETA BASICO.png" alt="Membresia Basica" />
          <img src="imagenes/Tarjetas de bono/TARJETA BASICO (1).png" alt="Membresia Esmeralda" />
          <img src="imagenes/Tarjetas de bono/TARJETA BASICO (2).png" alt="Membresia Premiun" />
        </div>
      </div>

      <div class="merchandising">
        <h2>Merchandising</h2>
        <div id="productos">
          <div class="producto">
            <img src="imagenes/Merchandise/camiseta sin fondo.png" alt="Mochila Principiante" />
            <span>MOCHILA PRINCIPIANTE</span> <span>14,99€</span>
          </div>
          <div class="producto">
            <img src="imagenes/Merchandise/Bag.png" alt="Camiseta Fleece" />
            <span>CAMISETA FLEECE</span> <span>14,99€</span>
          </div>
          <div class="producto">
            <img src="imagenes/Merchandise/Sudadera sin fondo.png" alt="Sudadera Capucha" />
            <span>SUDADERA CAPUCHA</span> <span>14,99€</span>
          </div>
        </div>
      </div>
      <div class="metodosPagos">
            <p>
                Metodos De Pago
                <img
            src="imagenes/Logo y inicio/logos/icons8-pago-apple-24.png"
            alt="Inicio"
            class="metodoPago"
          />
          <img
            src="imagenes/Logo y inicio/logos/icons8-amex-50.png"
            alt="Inicio"
            class="metodoPago"
          />
          <img
            src="imagenes/Logo y inicio/logos/mastercard sin fondo.png"
            alt="Inicio"
            class="metodoPago"
          />
          <img
            src="imagenes/Logo y inicio/logos/icons8-paypal-50.png"
            alt="Inicio"
            class="metodoPago"
          />
          <img
            src="imagenes/Logo y inicio/logos/icons8-visa-30.png"
            alt="Inicio"
            class="metodoPago"
          />
            </p>
            

      </div>
    </main>
    <footer>
      <p>
        Copyright © 2025 Tremendous Fighters, Todos los derechos reservados.
      </p>
    </footer>

</html>
